spring.application.name=order_service

# Server Configuration
server.port=8087

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.groups.enabled=true
springdoc.api-docs.groups.default.description=My API Description
springdoc.api-docs.groups.default.title=My API Title

# JWT Configuration
jwt.secret=yourSecretKey
jwt.expiration=86400000 # 1 ngày (milliseconds)

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG


